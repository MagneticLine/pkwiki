name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install
        run: corepack pnpm@9.0.0 install --frozen-lockfile --registry=https://registry.npmjs.org/
      - name: Build and test
        run: corepack pnpm@9.0.0 test
      - name: Lint
        run: corepack pnpm@9.0.0 lint
      - name: Check whitespace
        run: git diff --check
